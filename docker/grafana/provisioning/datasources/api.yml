apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "10s"
      httpMethod: POST

  - name: AutoscalerAPI
    type: marcusolsson-json-datasource
    access: proxy
    url: http://api:8000
    isDefault: false
    editable: false
