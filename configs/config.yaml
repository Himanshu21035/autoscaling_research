mpc:
  horizon: 12                     # steps ahead (= 12 minutes)
  lambda_cost: 1
  lambda_sla: 50
  lambda_stability: 5
  solver: ECOS_BB
  max_solver_time_ms: 500

# adapt:
#   alpha: 0.3                      # EMA smoothing factor
#   beta: 1.5                       # uncertainty buffer multiplier

grace:
  error_window: 10                # last N forecast errors
  min_confidence: 0.1             # never go below 10% MPC weight

safety:
  cooldown_seconds: 300
  max_scale_per_step: 5
  emergency_threshold: 0.95
  oscillation_window: 6

forecasting:
  lookback_minutes: 60
  horizon_minutes: 12
  retrain_interval_hours: 24

data:
  raw_dir: data/raw
  processed_dir: data/processed
  synthetic_dir: data/synthetic
  scale_factors:
    burstgpt: 600.0
    azure: 60.0
    alibaba: 50.0
  azure:
    path: data/raw/azure_trace.csv
    rps_col: rps
    time_col: timestamp
  synthetic:
    n_steps: 1440
    flat_rps: 300.0
    ramp_start: 50.0
    ramp_end: 800.0

logging:
  level: INFO
  log_dir: results/logs

metrics:
  rolling_windows: [5, 15, 60]       # minutes
  burst_sigma: 2.0                    # σ multiplier for burst_flag
  min_history_steps: 30               # min WindowBuffer length before forecasting

synthetic:
  n_days: 7
  seed: 42
  smooth:
    base_rps: 300.0
    amplitude: 150.0
    noise_std: 20.0
  bursty:
    base_rps: 200.0
    noise_std: 30.0
    spike_probability: 0.01
    spike_multiplier_range: [3.0, 8.0]
    spike_duration_range: [5, 20]
  flash_crowd:
    base_rps: 150.0
    noise_std: 15.0
    spike_multiplier: 10.0
    spike_start_day: 3      # fixed for reproducibility — documented below
    spike_start_hour: 14
    spike_duration_minutes: 90
  slow_ramp_up:
    start_rps: 50.0
    end_rps: 350.0
    noise_std: 5.0
    burst_height: 80.0
    burst_width: 8
  periodic_spikes:
    base_rps: 60.0
    noise_std: 3.0
    spike_period_steps: 24   # 24 steps = 2 hours at 5-min resolution
    spike_height: 200.0
    spike_width: 6
policies:
  threshold:
    target_rps_per_replica: 100.0

  pid:
    target_rps: 300.0
    kp: 0.5
    ki: 0.1
    kd: 0.05
    integral_limit: 500.0

  hpa:
    target_rps_per_replica: 100.0
    scale_up_cooldown: 1       # steps (1 step = 1 min)
    scale_down_cooldown: 5     # mirrors K8s 5-min stabilization window
adapt:
  alpha: 0.3                      # EWMA smoothing factor
  beta: 1.5                       # uncertainty buffer multiplier 
  epsilon_steps: 1            # FH OPT safety margin
  cold_start_min_s: 30.0      # lower bound on estimate
  cold_start_max_s: 600.0     # upper bound on estimate

policies:
  mpc:
    lambda_sla:  10.0         # SLA violation penalty weight
    lambda_cost:  1.0         # replica running cost weight
    lambda_stab:  0.5         # replica change penalty weight
forecasting:
  arima:
    max_p: 5
    max_q: 5
    online_window: 30
    refit_every: 50

  prophet:
    changepoint_prior_scale: 0.001

  lstm:
    window_size: 30
    hidden_size: 64
    num_layers: 2
    max_epochs: 100
    learning_rate: 0.001
    patience: 10
    min_series_length: 50
simulator:
  timestep_seconds: 60
  capacity_per_replica: 100.0
  cold_start_s: 120.0             
  cold_start_options: [60, 120, 180]
  sla_latency_ms: 500.0           
  base_latency_ms: 50.0
  overload_latency_multiplier: 3.0
  cost_per_replica_step: 1.0
  initial_replicas: 2
  min_replicas: 1
  max_replicas: 50

  