
# configs/config.yaml

simulator:
  timestep_seconds: 60
  capacity_per_replica: 100       # RPS each replica can handle
  base_latency_ms: 50
  cold_start_options: [60, 120, 180]   # seconds
  min_replicas: 1
  max_replicas: 50

mpc:
  horizon: 12                     # steps ahead (= 12 minutes)
  lambda_cost: 1
  lambda_sla: 50
  lambda_stability: 5
  solver: ECOS_BB
  max_solver_time_ms: 500

adapt:
  alpha: 0.3                      # EMA smoothing factor
  beta: 1.5                       # uncertainty buffer multiplier

grace:
  error_window: 10                # last N forecast errors
  min_confidence: 0.1             # never go below 10% MPC weight

safety:
  cooldown_seconds: 300
  max_scale_per_step: 5
  emergency_threshold: 0.95
  oscillation_window: 6

forecasting:
  lookback_minutes: 60
  horizon_minutes: 12
  retrain_interval_hours: 24

data:
  raw_dir: data/raw
  processed_dir: data/processed
  synthetic_dir: data/synthetic
  scale_factors:
    burstgpt: 600.0
    azure: 60.0
    alibaba: 50.0

logging:
  level: INFO
  log_dir: results/logs

metrics:
  rolling_windows: [5, 15, 60]       # minutes
  burst_sigma: 2.0                    # σ multiplier for burst_flag
  min_history_steps: 30               # min WindowBuffer length before forecasting

synthetic:
  n_days: 7
  seed: 42
  smooth:
    base_rps: 300.0
    amplitude: 150.0
    noise_std: 20.0
  bursty:
    base_rps: 200.0
    noise_std: 30.0
    spike_probability: 0.01
    spike_multiplier_range: [3.0, 8.0]
    spike_duration_range: [5, 20]
  flash_crowd:
    base_rps: 150.0
    noise_std: 15.0
    spike_multiplier: 10.0
    spike_start_day: 3      # fixed for reproducibility — documented below
    spike_start_hour: 14
    spike_duration_minutes: 90