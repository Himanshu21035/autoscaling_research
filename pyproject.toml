[tool.poetry]
name = "autoscaler-research"
version = "1.0.0"
description = "Predictive Autoscaling with Cold Start Co-Optimization"
authors = ["Himanshu Singh Baghel"]
python = "^3.11"

[tool.poetry.dependencies]
# Core
numpy = "^1.26"
pandas = "^2.2"
polars = "^0.20"
scipy = "^1.11"
matplotlib = "^3.8"
seaborn = "^0.13"

# Forecasting
statsmodels = "^0.14"
pmdarima = "^2.0"
prophet = "^1.1"
torch = "^2.2"
torchvision = "^0.17"

# Optimization
cvxpy = "^1.4"

# ML Utilities
scikit-learn = "^1.4"
joblib = "^1.3"
tqdm = "^4.66"

# Config & Utils
pyyaml = "^6.0"
python-dotenv = "^1.0"
click = "^8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
pytest-asyncio = "^0.23"
hypothesis = "^6.99"
black = "^24.0"
ruff = "^0.3"
mypy = "^1.8"
ipykernel = "^6.29"
jupyter = "^1.0"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
